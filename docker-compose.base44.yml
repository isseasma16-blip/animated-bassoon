name: animated-bassoon

services:
  db:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  migrate:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./api:/app
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && npm run migrate"]

  api:
    image: node:22-alpine
    working_dir: /app
    restart: on-failure
    volumes:
      - ./api:/app
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app
      PORT: "8000"
      NODE_ENV: development
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npm run dev"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s

  web:
    image: node:22-alpine
    working_dir: /app
    restart: on-failure
    volumes:
      - ./frontend:/app
    ports:
      - "3000:5173"
    environment:
      API_PROXY_TARGET: http://api:8000
      # Platform-provided: lets Vite accept the proxied preview hostname.
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS:
      BASE44_SANDBOX_HOST_DOMAIN:
    depends_on:
      api:
        condition: service_healthy
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npm run dev"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s

volumes:
  db-data:
